<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VirusScan Security — AI-assisted Android APK security analysis and risk assessment platform. Analyze APKs before you install them.">
    <title>VirusScan Security — Android Security Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <!-- Animated background -->
    <div class="auth-bg-grid"></div>
    <div class="auth-bg-orb auth-bg-orb--1"></div>
    <div class="auth-bg-orb auth-bg-orb--2"></div>
    <div class="auth-bg-orb auth-bg-orb--3"></div>

    <!-- Auth Card -->
    <div class="auth-card">
        <div class="auth-shield-icon">🔎︎</div>

        <h1 class="auth-title">VirusScan Security</h1>
        <p class="auth-subtitle">Android Security Intelligence</p>

        <p class="auth-description">
            Analyze Android applications before you install them.
            Detect malware, suspicious permissions, and risky behavior.
        </p>

        <button class="auth-google-btn" id="btn-google-signin">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="auth-divider">or</div>

        <button class="btn btn-outline" style="width: 100%; color: #94a3b8; border-color: rgba(255,255,255,0.15);"
                id="btn-demo-signin">
            Try as Guest
        </button>

        <div class="auth-features">
            <div class="auth-feature">
                <div class="auth-feature-icon">🔍</div>
                <div class="auth-feature-label">APK Scan</div>
            </div>
            <div class="auth-feature">
                <div class="auth-feature-icon">📜</div>
                <div class="auth-feature-label">Cert Verify</div>
            </div>
            <div class="auth-feature">
                <div class="auth-feature-icon">🛡</div>
                <div class="auth-feature-label">Protection</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already signed in, redirect
            if (Auth.isLoggedIn()) {
                window.location.href = '/home';
                return;
            }

            // Google sign-in (mock for hackathon)
            document.getElementById('btn-google-signin').addEventListener('click', () => {
                Auth.mockGoogleSignIn();
            });

            // Guest sign-in
            document.getElementById('btn-demo-signin').addEventListener('click', () => {
                Auth.setUser({
                    name: 'Guest User',
                    email: 'guest@virusscan.dev',
                    avatar: 'G',
                    signedInAt: new Date().toISOString(),
                });
                window.location.href = '/home';
            });
        });
    </script>
</body>
</html>
